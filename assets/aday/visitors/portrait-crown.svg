  <circle cx="160" cy="318" r="8" fill="#d4af37"/>
  <!-- head symmetric -->
  <ellipse cx="160" cy="200" rx="64" ry="78" fill="#9a8b7a"/>
  <ellipse cx="142" cy="192" rx="7" ry="5" fill="#1a1510"/>
  <ellipse cx="178" cy="192" rx="7" ry="5" fill="#1a1510"/>
  <path stroke="#5c4a3a" stroke-width="2" fill="none" d="M138 178 L182 178"/>
  <path stroke="#6b5344" stroke-width="2" fill="none" d="M150 238 L170 238"/>
  <!-- direct gaze highlight -->
  <circle cx="145" cy="188" r="2" fill="#e8dcc8" opacity="0.6"/>
  <circle cx="181" cy="188" r="2" fill="#e8dcc8" opacity="0.6"/>
</svg>
