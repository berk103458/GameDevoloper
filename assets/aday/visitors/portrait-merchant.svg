<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-label="Tüccar portre taslak">
  <defs>
    <linearGradient id="coldBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8fa8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2a4a5e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="400" fill="#0d0f14"/>
  <rect x="16" y="16" width="288" height="368" fill="#3d2e24" rx="4"/>
  <rect x="24" y="24" width="272" height="352" fill="#1a1510" rx="2"/>
  <!-- threat clue band (hide when is_hidden_threat false) -->
  <rect x="24" y="24" width="14" height="352" fill="url(#coldBand)" id="threat-band"/>
  <!-- hood shadow -->
  <path fill="#2a2520" d="M70 120 Q160 60 250 120 L260 200 Q160 140 60 200 Z"/>
  <path fill="#6b5344" d="M55 340 Q160 300 265 340 L265 376 L55 376 Z"/>
  <!-- face half lit -->
  <ellipse cx="175" cy="210" rx="58" ry="72" fill="#8a7358"/>
  <ellipse cx="130" cy="215" rx="42" ry="55" fill="#1a1510" opacity="0.55"/>
  <!-- one visible eye -->
  <ellipse cx="188" cy="200" rx="7" ry="5" fill="#1a1510"/>
  <path stroke="#5c4a3a" stroke-width="2" fill="none" d="M175 185 L200 182"/>
  <!-- neutral mouth -->
  <line x1="168" y1="248" x2="198" y2="246" stroke="#5c4a3a" stroke-width="2"/>
  <!-- wrapped bundle -->
  <rect x="72" y="268" width="64" height="52" rx="6" fill="#4a6b8a" opacity="0.9"/>
  <path stroke="#c4843a" stroke-width="3" fill="none" d="M80 280 L128 275 L120 310 L76 305 Z"/>
  <line x1="88" y1="268" x2="88" y2="320" stroke="#3d2e24" stroke-width="2"/>
</svg>
