<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-label="Kurucu portre taslak">
  <defs>
    <linearGradient id="warmFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4843a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d0f14" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="400" fill="#0d0f14"/>
  <!-- wood frame -->
  <rect x="16" y="16" width="288" height="368" fill="#3d2e24" rx="4"/>
  <rect x="24" y="24" width="272" height="352" fill="#1a1510" rx="2"/>
  <rect x="24" y="24" width="272" height="352" fill="url(#warmFace)"/>
  <!-- shoulders / cloak -->
  <path fill="#5c4a3a" d="M60 340 Q160 280 260 340 L260 376 L60 376 Z"/>
  <path fill="#8b7355" d="M100 320 L220 320 L200 360 L120 360 Z"/>
  <!-- head -->
  <ellipse cx="160" cy="200" rx="72" ry="88" fill="#9a7b5c"/>
  <!-- stubble -->
  <path fill="#6b5344" opacity="0.5" d="M100 230 Q160 270 220 230 L215 250 Q160 285 105 250 Z"/>
  <!-- eyes looking slightly up -->
  <ellipse cx="135" cy="195" rx="8" ry="6" fill="#1a1510"/>
  <ellipse cx="185" cy="192" rx="8" ry="6" fill="#1a1510"/>
  <path stroke="#5c4a3a" stroke-width="3" fill="none" d="M130 175 Q160 165 190 172"/>
  <!-- hopeful mouth -->
  <path stroke="#6b5344" stroke-width="2" fill="none" d="M145 235 Q160 245 175 235"/>
  <!-- building roll -->
  <rect x="200" y="260" width="48" height="56" rx="4" fill="#c4843a" opacity="0.85"/>
  <line x1="208" y1="272" x2="240" y2="272" stroke="#3d2e24" stroke-width="2"/>
  <line x1="208" y1="284" x2="235" y2="284" stroke="#3d2e24" stroke-width="2"/>
</svg>
